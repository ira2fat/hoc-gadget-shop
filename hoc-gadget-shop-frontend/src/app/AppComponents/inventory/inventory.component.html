<div class="container mt-4">
  <h3>Inventory</h3>

  <!-- Form Section -->
  <form class="row g-3 align-items-center mb-4" (ngSubmit)="onSubmit()" novalidate>
    <div class="col-md-2">
      <input
        type="text"
        class="form-control"
        placeholder="Product Id"
        disabled={{disableProductIDInput}}
        name="productId" [(ngModel)]="inventoryData.productID"
      />
    </div>

    <div class="col-md-3">
      <select
        class="form-select"
        name="productName" [(ngModel)]="inventoryData.productName"
      >
        <option value="">Choose...</option>
        <option value="Earphones">Earphones</option>
        <option value="Mobile">Mobile</option>
        <option value="Playstation">Playstation</option>
      </select>
    </div>

    <div class="col-md-2">
      <input
        type="number"
        class="form-control"
        placeholder="Stock"
        name="stock"
        [(ngModel)]="inventoryData.avaliableStock"
      />
    </div>

    <div class="col-md-2">
      <input
        type="number"
        class="form-control"
        placeholder="Reorder Point"
        name="reorderPoint"
        [(ngModel)]="inventoryData.reorderPoint"
      />
    </div>

    <div class="col-md-2">
      <button type="submit" class="btn btn-primary w-100">Submit</button>
    </div>
  </form>

  <!-- Inventory Table -->
  <h5>Inventory Details</h5>
  <table class="table table-striped table-bordered align-middle">
    <thead class="table-light">
      <tr>
        <th scope="col">#</th>
        <th scope="col">Product Id</th>
        <th scope="col">Product Name</th>
        <th scope="col">Stock Available</th>
        <th scope="col">Reorder Point</th>
        <th scope="col">Action</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let item of inventoryList; let i = index">
        <th scope="row">{{ i + 1 }}</th>
        <td>{{ item.ProductId }}</td>
        <td>{{ item.ProductName }}</td>
        <td>{{ item.AvaliableStock }}</td>
        <td>{{ item.ReorderPoint }}</td>
        <td>
          <button class="btn btn-sm btn-primary me-2" (click)="populateFormForEdit(item)" >
            Edit
          </button>
          <button class="btn btn-sm btn-danger" (click)="OpenConfirmDialog(item.ProductId)" >
            Delete
          </button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
